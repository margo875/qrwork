name = "qrwork"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# Domeen: qrp.krativara.ee (Margo 02.11.2026: nimi Krativara, domeen krativara.ee registreeritud, sama Cloudflare'i konto).
# Kleebiseid pole prinditud, seega vana aadressi (kratt.kindavel.ee) ei suunata, see lihtsalt eemaldatakse.
# Eeldus: krativara.ee on selles Cloudflare'i kontos aktiivne tsoon (nimeserverid Cloudflare'i omad), muidu deploy ebaõnnestub.
# QR sisaldab aadressi püsivalt: pärast kleebiste printimist seda enam ei muudeta.
routes = [{ pattern = "qrp.krativara.ee", custom_domain = true }]
workers_dev = false

# Workers Logs (serveri vead ja console.error Cloudflare'i paneelis: Workers → qrwork → Logs).
[observability]
enabled = true

# Deploy'i id (versioon muutub iga deploy'ga, kasutajale tuleb „uus versioon, värskenda“ riba).
[version_metadata]
binding = "CF_VERSION"

# Kõik andmed (register, kasutajad, laenud, logi) on ühes Durable Objectis (SQLite, tasuta plaanil lubatud).
[[durable_objects.bindings]]
name = "REGISTER"
class_name = "Register"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Register"]

# Valikuline: fotod võtmisel/tagastamisel/märkusega. Loo: npx wrangler r2 bucket create qrwork-fotod
# Ilma selle plokita on foto funktsioon välja lülitatud.
# [[r2_buckets]]
# binding = "FOTOD"
# bucket_name = "qrwork-fotod"

# Valikuline: arve/tšeki/andmesildi pildilt lugemine (Workers AI, tasuta kvoot; Margo 10.11.2026). Esimesel korral:
# Haldus → Seaded → „Nõustun pildimudeli litsentsiga“ (Meta Llama 3.2 Vision). Ilma selle plokita täidab haldur väljad käsitsi.
# Dokumentide originaalid (foto/PDF) hoitakse samas R2-s nagu fotod (FOTOD).
[ai]
binding = "AI"

# Saladused (mitte siia faili!):
#   npx wrangler secret put ADMIN_TOKEN     (≥ 16 märki, nt openssl rand -base64 32)
#   npx wrangler secret put TOKEN_SECRET    (≥ 16 märki; IP-räsi sool)
#   valikuline: DEV_TOKEN       (≥ 16 märki; arendaja vealogi lehel /dev)
#   valikuline: TG_BOT_TOKEN + TG_CHAT_ID (Telegram), NTFY_TOPIC (+ NTFY_TOKEN, NTFY_URL), OMANIKU_TELEFON (+3725…, „Helista omanikule“)
#   valikuline: PBKDF2_ITER (10000–100000, vaikimisi 100000; vt README „Parool ja CPU“)

# ---------- Prooviversioon (Margo 10.11.2026): ilma domeenita, aadress qrwork-proov.<konto>.workers.dev ----------
# Oma andmed (eraldi Durable Object), ei sega päris versiooni. Käivitamine: vt PROOV.md (npx wrangler deploy --env proov).
[env.proov]
name = "qrwork-proov"
workers_dev = true
routes = []
[env.proov.ai]
binding = "AI"
[[env.proov.durable_objects.bindings]]
name = "REGISTER"
class_name = "Register"
[env.proov.version_metadata]
binding = "CF_VERSION"
# Fotode ja dokumentide proovimiseks: loo R2 bucket „qrwork-proov-fotod“ ja eemalda kolme järgmise rea eest #
# [[env.proov.r2_buckets]]
# binding = "FOTOD"
# bucket_name = "qrwork-proov-fotod"
