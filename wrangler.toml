name = "qrwork"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# Domeen: kratt.kindavel.ee (Margo otsus 01.11.2026, rakenduse nimi oli „Kratt“, 02.11.2026 „Krativara“). kindavel.ee DNS on samas Cloudflare'i kontos,
# custom_domain loob DNS-kirje ja sertifikaadi esimesel deploy'l. QR-kleebistes on aadress püsivalt, seda ei muudeta.
# qrwork.kindavel.ee (esimene katsedomeen) eemaldatud 01.11.2026 (Margo).
routes = [{ pattern = "kratt.kindavel.ee", custom_domain = true }]
# Nimi Krativara (Margo 02.11.2026). Kui krativara.ee on registreeritud ja Cloudflare'i lisatud (tsoon samas kontos):
#   routes = [
#     { pattern = "krativara.ee", custom_domain = true },
#     { pattern = "kratt.kindavel.ee", custom_domain = true },   # vana, suunab edasi
#   ]
#   [vars]
#   PEA_HOST = "krativara.ee"
# Vana domeeni kleebised jäävad tööle (301/308 suunamine + rakendus tunneb ära ka vana domeeni QR-i, src/lehed.js OMA_HOSTID).
workers_dev = false

# Kõik andmed (register, kasutajad, laenud, logi) on ühes Durable Objectis (SQLite, tasuta plaanil lubatud).
[[durable_objects.bindings]]
name = "REGISTER"
class_name = "Register"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Register"]

# Valikuline: fotod võtmisel/tagastamisel/märkusega. Loo: npx wrangler r2 bucket create qrwork-fotod
# Ilma selle plokita on foto funktsioon välja lülitatud.
# [[r2_buckets]]
# binding = "FOTOD"
# bucket_name = "qrwork-fotod"

# Saladused (mitte siia faili!):
#   npx wrangler secret put ADMIN_TOKEN     (≥ 16 märki, nt openssl rand -base64 32)
#   npx wrangler secret put TOKEN_SECRET    (≥ 16 märki; IP-räsi sool)
#   valikuline: TG_BOT_TOKEN + TG_CHAT_ID (Telegram), NTFY_TOPIC (+ NTFY_TOKEN, NTFY_URL)
#   valikuline: PBKDF2_ITER (10000–100000, vaikimisi 100000; vt README „Parool ja CPU“)
